name: Android APK

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build downloadable APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_NO_DOTENV: '1'
      # Large React Native AARs can exceed Gradle's default read timeout on a
      # temporarily slow Maven Central connection.
      GRADLE_OPTS: >-
        -Dorg.gradle.internal.http.connectionTimeout=120000
        -Dorg.gradle.internal.http.socketTimeout=300000
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      EXPO_PUBLIC_PRIVACY_POLICY_URL: ${{ vars.EXPO_PUBLIC_PRIVACY_POLICY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Validate public build configuration
        shell: bash
        run: |
          missing=0
          for name in EXPO_PUBLIC_API_URL EXPO_PUBLIC_FIREBASE_API_KEY EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Repository variable $name is required to build a usable APK."
              missing=1
            fi
          done
          exit "$missing"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ui
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew
      - name: Build standalone release APK
        working-directory: android
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ./gradlew assembleRelease --no-daemon --stacktrace; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Android build failed after $attempt attempts."
              exit 1
            fi
            delay=$((attempt * 20))
            echo "::warning::Gradle attempt $attempt failed; retrying in ${delay}s to recover from a transient repository download error."
            sleep "$delay"
          done
      - name: Prepare artifact
        shell: bash
        run: cp android/app/build/outputs/apk/release/app-release.apk "VEGETA-develop-${GITHUB_RUN_NUMBER}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEGETA-develop-${{ github.run_number }}
          path: VEGETA-develop-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 14
